[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.4.0/esptool.zip
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -std=gnu++20

build_flags =
    -std=gnu++20

lib_deps =
    EDP-Localisation=symlink://../../..
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#feature/primitives_introduction
    EDP-Platform=https://github.com/ESPressio-Development-Platform/EDP-Platform.git#main
    EDP-Platform-Portable=https://github.com/ESPressio-Development-Platform/EDP-Platform-Portable.git#main
    EDP-Memory=https://github.com/ESPressio-Development-Platform/EDP-Memory.git#main
    EDP-Persistence=https://github.com/ESPressio-Development-Platform/EDP-Persistence.git#main
    EDP-Persistence-ESP-IDF=https://github.com/ESPressio-Development-Platform/EDP-Persistence-ESP-IDF.git#main
