name: Host Contract Tests

on:
  workflow_dispatch:

jobs:
  host-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDP-Localisation
        uses: actions/checkout@v4

      - name: Explain dependency requirement
        run: |
          echo "This workflow requires sibling private EDP-System and EDP-Memory checkouts."
          echo "Run tests/run_tests.py locally with sibling repositories, or provision cross-repository checkout credentials before enabling automatic CI."
          exit 1
