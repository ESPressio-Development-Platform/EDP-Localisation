name: Toolchain Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  toolchain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDP-Localisation
        uses: actions/checkout@v4

      - name: Run Python toolchain regression tests
        env:
          PYTHONPATH: tools
        run: |
          python3 -m py_compile tools/edp_localisation/*.py
          python3 -m unittest discover -s tools/tests -v
