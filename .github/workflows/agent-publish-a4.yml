name: Temporary A4 Exact Tree Publisher

on:
  push:
    branches:
      - agent-publish-a4

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact target baseline
        uses: actions/checkout@v4
        with:
          ref: serialisation_prerequisites
          fetch-depth: 0

      - name: Apply RPI400-tested patch and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='61b8966e65484fb6f2de60178d01a61222358b79'
          EXPECTED_TREE='ee0178b3b3e1c6cd348cbe99cea2641b86837de0'
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git show origin/agent-publish-a4-data:.github/a4-data/a4.patch.gz | gzip -d > /tmp/a4.patch
          git apply --check /tmp/a4.patch
          git apply /tmp/a4.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          echo "Expected tree: $EXPECTED_TREE"
          echo "Actual tree:   $ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          git config user.name 'Simon Stuart'
          git config user.email 'lakraven@gmail.com'
          git commit -m '#19 Document reverse Field-name resolution'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:serialisation_prerequisites
