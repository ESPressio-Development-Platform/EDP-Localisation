name: Temporary A4 Exact Tree Publisher

on:
  push:
    branches:
      - agent-publish-a4

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact target baseline
        uses: actions/checkout@v4
        with:
          ref: serialisation_prerequisites
          fetch-depth: 0

      - name: Apply RPI400-tested patch and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='b70deb4dbc222fd8b9e3834919183435f0492f7b'
          EXPECTED_TREE='e668de937609f79c1c5212b80b7a14c27089a005'
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          cat > /tmp/a4.patch.gz.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/a4.patch.gz.b64 | gzip -d > /tmp/a4.patch
          git apply --check /tmp/a4.patch
          git apply /tmp/a4.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          echo "Expected tree: $EXPECTED_TREE"
          echo "Actual tree:   $ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          git config user.name 'Simon Stuart'
          git config user.email 'lakraven@gmail.com'
          git commit -m '#19 Implement reverse Field-name resolution'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:serialisation_prerequisites
